---
name: Check knowledge bot config

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      config:
        description: Path of the consumer config.
        type: string
        default: .github/knowledge-bot.yaml

permissions: {}

jobs:
  validate:
    name: Validate the config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # checkouts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This repository at the commit the caller references.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .knowledge-bot/auto-triage
          persist-credentials: false
      - id: bot
        uses: ./.knowledge-bot/auto-triage/actions/setup-bot
        with:
          config: ${{ inputs.config }}
      - env:
          BOT_SCRIPTS_DIR: ${{ steps.bot.outputs.bot-scripts-dir }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          node "$BOT_SCRIPTS_DIR/src/cli/validate-config.ts" --config "$CONFIG" | tee -a "$GITHUB_STEP_SUMMARY"
