---
name: Test

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bot-scripts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: bot-scripts
      - run: npm test
        working-directory: bot-scripts
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v0.89.21
          gh aw compile triage
          git diff --exit-code -- .github/workflows/triage.lock.yml .github/aw/actions-lock.json \
            || { echo "triage.lock.yml is stale: run 'gh aw compile triage' and commit the result" >&2; exit 1; }
