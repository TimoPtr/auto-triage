---
name: Append to knowledge index

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      slug:
        description: Product slug; prefix of the cache keys and artifact names.
        type: string
        required: true
      config:
        description: Path of the consumer config.
        type: string
        default: .github/knowledge-bot.yaml
      item:
        description: issue:<n> or pull:<n>
        type: string
        required: true

permissions: {}

jobs:
  append:
    name: Append the item
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: knowledge-index-${{ inputs.slug }}
      cancel-in-progress: false
    permissions:
      contents: read  # checkouts of the consumer repository and of this one
      actions: read  # restore-index downloads the index artifact of an earlier run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This repository at the commit the caller references.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .knowledge-bot/auto-triage
          persist-credentials: false
      - id: bot
        uses: ./.knowledge-bot/auto-triage/actions/setup-bot
        with:
          config: ${{ inputs.config }}
      - id: index
        uses: ./.knowledge-bot/auto-triage/actions/restore-index
        with:
          slug: ${{ inputs.slug }}
          config: ${{ inputs.config }}
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.index.outputs.usable != 'true'
        env:
          STATUS: ${{ steps.index.outputs.status }}
        run: echo "No usable index ($STATUS); nothing to append to. The next build will include this item." >> "$GITHUB_STEP_SUMMARY"
      - id: append
        if: steps.index.outputs.usable == 'true'
        env:
          BOT_SCRIPTS_DIR: ${{ steps.bot.outputs.bot-scripts-dir }}
          KB_MODEL_CACHE: ${{ steps.bot.outputs.model-cache }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          INDEX: ${{ steps.index.outputs.index-path }}
          ITEM: ${{ inputs.item }}
          REPO: ${{ github.repository }}
        # No raw store here: the item just changed, so nothing of it could be reused, and a one-item
        # store must never become the newest raw cache entry the nightly build restores.
        run: |
          set -euo pipefail
          node "$BOT_SCRIPTS_DIR/src/cli/append.ts" --config "$CONFIG" --index "$INDEX" \
            --model-cache "$KB_MODEL_CACHE" --repo "$REPO" --item "$ITEM" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only a changed index is worth a new cache entry and artifact; a bot pull request that was never indexed is not.
      - if: steps.append.outputs.changed == 'true'
        uses: ./.knowledge-bot/auto-triage/actions/publish-index
        with:
          slug: ${{ inputs.slug }}
          config: ${{ inputs.config }}
          index-path: ${{ steps.index.outputs.index-path }}
