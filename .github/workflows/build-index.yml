---
name: Build knowledge index

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      slug:
        description: Product slug; prefix of the cache keys and artifact names.
        type: string
        required: true
      config:
        description: Path of the consumer config.
        type: string
        default: .github/knowledge-bot.yaml
      checkouts:
        description: Newline-separated owner/repo list of extra repositories read from a checkout (docs).
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout; the build itself stops 20 minutes earlier so the raw store is still published.
        type: number
        default: 350
      tracking:
        description: Keep a tracking issue open while the index is stale, unusable or missing.
        type: boolean
        default: true
      full:
        description: Force a full rebuild instead of an incremental build from the restored index.
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: knowledge-index-${{ inputs.slug }}
      cancel-in-progress: false
    permissions:
      contents: read  # checkouts of the consumer repository and of this one
      actions: read  # restore-index and the feedback step download artifacts of earlier runs
      issues: write  # report-feedback keeps the digest issue, report-eval-status the regression issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "KB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # This repository at the commit the caller references: job.workflow_repository and job.workflow_sha
      # describe the reusable workflow file that defines the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .knowledge-bot/auto-triage
          persist-credentials: false
      - uses: ./.knowledge-bot/auto-triage/actions/setup-bot
        with:
          config: ${{ inputs.config }}
      - id: previous
        uses: ./.knowledge-bot/auto-triage/actions/restore-index
        with:
          slug: ${{ inputs.slug }}
          config: ${{ inputs.config }}
        env:
          GH_TOKEN: ${{ github.token }}
      - id: checkouts
        env:
          CHECKOUTS: ${{ inputs.checkouts }}
          OWN_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--self . --checkout "$OWN_REPO=.")
          while IFS= read -r repo; do
            repo="${repo//[[:space:]]/}"
            [ -z "$repo" ] && continue
            [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad checkout $repo" >&2; exit 1; }
            dir=".knowledge-bot/checkouts/$repo"
            git clone --depth 1 --quiet "https://github.com/$repo.git" "$dir"
            args+=(--checkout "$repo=$dir")
          done <<< "$CHECKOUTS"
          printf '%s\n' "${args[@]}" > .knowledge-bot/checkout-args
      - id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          INDEX: ${{ steps.previous.outputs.index-path }}
          RAW: ${{ steps.previous.outputs.raw-path }}
          PREVIOUS_USABLE: ${{ steps.previous.outputs.usable }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          mapfile -t args < .knowledge-bot/checkout-args
          previous=()
          if [ "$PREVIOUS_USABLE" = "true" ]; then cp "$INDEX" "$INDEX.previous"; previous=(--previous "$INDEX.previous"); fi
          if [ "$FULL" = "true" ]; then previous+=(--full); fi
          # Stop before the job timeout: a step that fails still runs the failure steps, a cancelled job does not.
          # The margin is measured from the job start, so the setup steps do not eat into it.
          margin=20
          [ "$TIMEOUT_MINUTES" -gt 40 ] || margin=$((TIMEOUT_MINUTES / 4))
          budget=$(((TIMEOUT_MINUTES - margin) * 60 - ($(date +%s) - KB_JOB_START)))
          [ "$budget" -gt 60 ] || budget=60
          timeout --kill-after=60 "$budget" \
            node "$BOT_SCRIPTS_DIR/src/cli/build.ts" --config "$CONFIG" --out "$INDEX" --raw "$RAW" \
              --model-cache "$KB_MODEL_CACHE" "${previous[@]}" "${args[@]}"
          rm -f "$INDEX.previous"
      - if: success()
        uses: ./.knowledge-bot/auto-triage/actions/publish-index
        with:
          slug: ${{ inputs.slug }}
          config: ${{ inputs.config }}
          index-path: ${{ steps.previous.outputs.index-path }}
          raw-path: ${{ steps.previous.outputs.raw-path }}
      # Reactions, replies and outcomes of the bot comments, for the suppression list and the weekly tuning.
      - id: feedback
        if: success() && hashFiles(steps.previous.outputs.raw-path) != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          RAW: ${{ steps.previous.outputs.raw-path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$BOT_SCRIPTS_DIR/src/cli/collect-feedback.ts" --config "$CONFIG" --raw "$RAW" --repo "$REPO" \
            --out .knowledge-bot/feedback --github
      - if: steps.feedback.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .knowledge-bot/feedback/feedback.json
          key: ${{ inputs.slug }}-feedback-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.feedback.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-${{ inputs.slug }}
          path: .knowledge-bot/feedback
          retention-days: 30
      - if: steps.feedback.outcome == 'success'
        uses: ./.knowledge-bot/auto-triage/actions/report-feedback
        with:
          slug: ${{ inputs.slug }}
          digest-path: .knowledge-bot/feedback/digest.md
          comments: ${{ steps.feedback.outputs.comments }}
          tracking: ${{ inputs.tracking }}
        env:
          GH_TOKEN: ${{ github.token }}
      # The test split of the consumer's eval cases, when it has any, scored against the index just built.
      - id: eval
        if: success()
        env:
          CONFIG: ${{ inputs.config }}
          INDEX: ${{ steps.previous.outputs.index-path }}
        run: |
          set -euo pipefail
          node "$BOT_SCRIPTS_DIR/src/cli/run-eval.ts" --config "$CONFIG" --index "$INDEX" --split test \
            --out .knowledge-bot/eval --model-cache "$KB_MODEL_CACHE"
          if [ -f .knowledge-bot/eval/summary.md ]; then cat .knowledge-bot/eval/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      # The previous nightly eval (newest default-branch artifact) is the baseline; compare-eval's exit 3 is a finding, not a failure.
      - id: previous-eval
        if: success() && hashFiles('.knowledge-bot/eval/summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          id="$(.knowledge-bot/auto-triage/actions/restore-index/restore-artifact.sh "eval-$SLUG" .knowledge-bot/eval-previous dir)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - if: success() && hashFiles('.knowledge-bot/eval/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ inputs.slug }}
          path: .knowledge-bot/eval
          retention-days: 30
      - id: compare
        if: steps.previous-eval.outputs.id != '' && steps.previous-eval.outputs.id != '0'
        run: |
          set -euo pipefail
          status=0
          node "$BOT_SCRIPTS_DIR/src/cli/compare-eval.ts" .knowledge-bot/eval-previous/cases.jsonl .knowledge-bot/eval/cases.jsonl --json \
            > .knowledge-bot/eval/comparison.json || status=$?
          [ "$status" = "0" ] || [ "$status" = "3" ] || exit "$status"
      - if: steps.previous-eval.outcome == 'success'
        uses: ./.knowledge-bot/auto-triage/actions/report-eval-status
        with:
          slug: ${{ inputs.slug }}
          comparison-path: .knowledge-bot/eval/comparison.json
          tracking: ${{ inputs.tracking }}
        env:
          GH_TOKEN: ${{ github.token }}
      # A build that died on the rate limit keeps its raw store progress for the next run.
      - if: failure() && steps.build.outcome == 'failure'
        uses: ./.knowledge-bot/auto-triage/actions/publish-index
        with:
          slug: ${{ inputs.slug }}
          config: ${{ inputs.config }}
          index-path: ${{ steps.previous.outputs.index-path }}
          raw-path: ${{ steps.previous.outputs.raw-path }}
          publish-index: 'false'
      - id: status
        if: always() && steps.previous.outcome == 'success'
        env:
          CONFIG: ${{ inputs.config }}
          INDEX: ${{ steps.previous.outputs.index-path }}
        run: node "$BOT_SCRIPTS_DIR/src/cli/index-status.ts" --config "$CONFIG" --index "$INDEX"
      - if: always() && steps.status.outcome == 'success'
        uses: ./.knowledge-bot/auto-triage/actions/report-index-status
        with:
          slug: ${{ inputs.slug }}
          status: ${{ steps.status.outputs.status }}
          source: ${{ steps.build.outcome == 'success' && 'build' || steps.previous.outputs.source }}
          age-days: ${{ steps.status.outputs.age-days }}
          reason: ${{ steps.status.outputs.reason }}
          tracking: ${{ inputs.tracking }}
        env:
          GH_TOKEN: ${{ github.token }}
