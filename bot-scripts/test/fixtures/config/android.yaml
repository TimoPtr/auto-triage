version: 1

product:
  name: Home Assistant Companion for Android
  slug: android

providers:
  github:
    home-assistant/android:
      issues:
        states: [open, closed]
        closedWithinDays: 730
        comments: true
      pulls:
        states: [merged, closed]
      discussions:
        categories: [general, q-a]
      releases: {}
      code:
        include: ["**/*.kt"]
