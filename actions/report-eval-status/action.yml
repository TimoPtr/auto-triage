---
name: Report the retrieval eval status
description: Writes the comparison with the previous nightly eval to the job summary and keeps one tracking issue open while it shows a regression.
inputs:
  slug:
    description: Product slug.
    required: true
  comparison-path:
    description: The JSON written by compare-eval; absent when there was nothing to compare against.
    required: true
  tracking:
    description: Maintain the tracking issue. Needs GH_TOKEN with issues write.
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SLUG: ${{ inputs.slug }}
        COMPARISON: ${{ inputs.comparison-path }}
        TRACKING: ${{ inputs.tracking }}
      run: |
        set -euo pipefail
        if [ ! -f "$COMPARISON" ]; then
          echo "Knowledge eval $SLUG: no previous run to compare against" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        read -r n delta lo hi regression < <(node -e '
          const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
          const f = (x) => Number(x).toFixed(1);
          console.log([c.n, f(c.deltaRecallAt5), f(c.ci95[0]), f(c.ci95[1]), c.regression ? "true" : "false"].join(" "));' "$COMPARISON")
        line="Knowledge eval $SLUG: $n paired cases, recall@5 ${delta} points against the previous run (95% CI ${lo} to ${hi})"
        [ "$regression" = "true" ] && line="$line: REGRESSION"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
        [ "$TRACKING" = "true" ] || exit 0
        title_prefix="Knowledge eval $SLUG:"
        existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label knowledge-bot --state open \
          --search "\"$title_prefix\" in:title" --json number --jq '.[0].number // empty')"
        body="$line. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        if [ "$regression" != "true" ]; then
          if [ -n "$existing" ]; then
            gh issue close --repo "$GITHUB_REPOSITORY" "$existing" --comment "No regression against the previous run any more. $body"
          fi
          exit 0
        fi
        gh label create knowledge-bot --repo "$GITHUB_REPOSITORY" --description "Knowledge bot health" --color 5319e7 2>/dev/null || true
        if [ -n "$existing" ]; then
          gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body "$body"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title_prefix regression" --label knowledge-bot --body "$body"
        fi
